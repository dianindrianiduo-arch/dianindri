{% extends 'base.html' %}
{% block title %}{{ 'Edit' if student else 'Tambah' }} Murid{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header border-0 pt-4 px-4">
        <h5 class="fw-bold mb-0">
          <i class="bi bi-person-{{ 'pencil' if student else 'plus' }}-fill text-primary me-2"></i>
          {{ 'Edit Data Murid' if student else 'Tambah Murid Baru' }}
        </h5>
      </div>
      <div class="card-body px-4 pb-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">NIS <span class="text-danger">*</span></label>
              <input type="text" name="nis" class="form-control" required
                     value="{{ student.nis if student else '' }}" placeholder="Nomor Induk Siswa">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Kelas <span class="text-danger">*</span></label>
              <select name="class_id" class="form-select" required>
                <option value="">-- Pilih Kelas --</option>
                {% for kelas in all_classes %}
                <option value="{{ kelas.id }}"
                  {% if student and student.class_id == kelas.id %}selected{% endif %}>
                  Kelas {{ kelas.name }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Nama Lengkap Murid <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required
                     value="{{ student.name if student else '' }}" placeholder="Nama lengkap">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Jenis Kelamin</label>
              <select name="gender" class="form-select">
                <option value="L" {% if not student or student.gender == 'L' %}selected{% endif %}>Laki-laki (L)</option>
                <option value="P" {% if student and student.gender == 'P' %}selected{% endif %}>Perempuan (P)</option>
              </select>
            </div>
            <div class="col-12"><hr class="my-1"><small class="text-muted fw-semibold">DATA WALI MURID</small></div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nama Wali</label>
              <input type="text" name="parent_name" class="form-control"
                     value="{{ student.parent_name if student else '' }}" placeholder="cth: Bapak Ahmad Santoso">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">No. WhatsApp Wali</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-whatsapp text-success"></i></span>
                <input type="text" name="parent_phone" class="form-control"
                       value="{{ student.parent_phone if student else '' }}" placeholder="08xxxxxxxxxx">
              </div>
              <div class="form-text">Pastikan nomor aktif WhatsApp</div>
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-end mt-4">
            <a href="/students" class="btn btn-outline-secondary">Batal</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>{{ 'Perbarui' if student else 'Simpan' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
